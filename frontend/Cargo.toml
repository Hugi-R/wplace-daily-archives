# To build the wasm lib: cd frontend && ~/.cargo/bin/wasm-pack build --target web --no-default-features
# result is in pkg folder.

[package]
name = "wpda-wasm"
version = "0.1.0"
edition = "2024"

# Declare an independent workspace so this crate is NOT absorbed by the parent
# wplace-daily-archives workspace. That lets the [profile.release] below apply
# to the wasm build (and its `wimage` path dependency) instead of being ignored
# in favour of the root workspace's profile.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
wimage = { path = "/run/media/system/DataBtrfs/wplace/wplace-image/wimage" }
wasm-bindgen = "0.2.118"
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ['Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window'] }

# Size-tuned release profile for the wasm cdylib.
# `opt-level = 3` (not "z") is deliberate: rustc's speed optimisation does the
# heavy inlining + dead-code elimination, which leaves more for `wasm-opt -Oz`
# to strip afterwards. `lto = "fat"` + `codegen-units = 1` cross-crate DCE the
# `wimage` dependency tree (zstd/png). `panic = "abort"` drops unwinding tables
# (large in wasm).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Pass `--enable-bulk-memory` to wasm-opt: the LTO'd output contains
# `memory.copy` ops that the bundled (old) binaryen rejects by default. `-Oz`
# maximises size reduction.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]