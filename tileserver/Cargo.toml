[package]
name = "wpda-tileserver"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["timeout"] }

# rusqlite + a small connection pool (the Go code used database/sql's pool)
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"   # must match the rusqlite version above
scheduled-thread-pool = "0.2"

chrono = "0.4"
crc32fast = "1"
lru = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true