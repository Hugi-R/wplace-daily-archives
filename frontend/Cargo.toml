# To build the wasm lib: ~/.cargo/bin/wasm-pack build --target web --no-default-features
# results in pkg folder

[package]
name = "wimage-wasm"
version = "0.1.0"
edition = "2024"

# Make it independent from root workspace, it needs special build profile
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
wimage = { git = "https://github.com/Hugi-R/wplace-image", rev = "d718548" }
wasm-bindgen = "0.2.118"
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ['Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window'] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]